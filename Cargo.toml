[package]
name = "port-rs"
version = "0.1.0"
edition = "2024"
description = "A standalone Rust implementation of MacPorts CLI functionality"

[[bin]]
name = "port"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
globset = "0.4"
indicatif = "0.18"
console = "0.16"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "net", "sync"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bench]]
name = "index"
harness = false
