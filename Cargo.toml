[package]
name = "port-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Tsiry Sandratraina <tsiry.sndr@rocksky.app>"]
description = "A standalone Rust implementation of MacPorts CLI functionality"

[[bin]]
name = "port"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
indicatif = "0.18"
console = "0.16"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "net", "sync", "process", "io-std"] }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "collation"] }
ed25519-compact = { version = "2.6", default-features = false, features = ["std"] }
base64 = "0.22"
tar = { version = "0.4", default-features = false }
bzip2 = "0.6"
ripemd = "0.2"
molt = { version = "0.3.1", path = "vendor/molt" }
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bench]]
name = "index"
harness = false

[workspace]
members = ["vendor/molt"]
default-members = ["."]
