name: Rust
on: [push, pull_request]
jobs:
  test:
    name: macOS (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FluentCI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Set up rust
        run: fluentci run setup-rust setup --toolchain stable --targets '${{ matrix.target }}' --components rustfmt,clippy | node "$GITHUB_WORKSPACE/.ci-tooling/.fluentci/github-env.mjs"
        shell: bash
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --target ${{ matrix.target }} --all-targets -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo test --locked -p molt --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
    defaults:
      run:
        shell: bash
